<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM Achievers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA;--card:#FFFFFF;--ink:#172033;--ink2:#4B5567;--ink3:#7A8496;--line:#E2E6EE;--line2:#CDD3DE;
  --azul:#2563EB;--azul2:#1D4ED8;--azulf:#EAF1FE;--verde:#16A34A;--verdef:#E8F7EE;--rojo:#DC2626;--rojof:#FDECEC;
  --amar:#D97706;--amarf:#FEF5E6;--gris:#64748B;--grisf:#F1F4F8;--morado:#7C3AED;--moradof:#F2EDFE;
  --r:14px;--sh:0 1px 2px rgba(23,32,51,.05),0 6px 20px rgba(23,32,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--azul)}
/* ---------- login ---------- */
#acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.caja{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:32px 28px;width:100%;max-width:400px}
.marca{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#7C3AED);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.caja h1{font-size:23px;margin:0 0 6px}
.caja p{margin:0 0 18px;color:var(--ink2)}
label.l{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.in{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:16px}
.in:focus{outline:2px solid var(--azul);outline-offset:1px;border-color:var(--azul)}
textarea.in{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--grisf)}
.btn.p{background:var(--azul);border-color:var(--azul);color:#fff}.btn.p:hover{background:var(--azul2)}
.btn.r{color:var(--rojo);border-color:#F3C4C4}.btn.r:hover{background:var(--rojof)}
.btn.full{width:100%;padding:13px;margin-top:18px;font-size:16px}
.err{color:var(--rojo);font-size:14px;min-height:20px;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--ink2);font-size:14px}
/* ---------- app ---------- */
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.topin .marca{margin:0}
.topin .marca b{font-size:18px}
nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:9px 13px;border-radius:9px;font-weight:600;color:var(--ink2);white-space:nowrap}
nav.tabs button.on{background:var(--azulf);color:var(--azul)}
nav.tabs button:hover:not(.on){background:var(--grisf)}
.red{font-size:13px;color:var(--ink3);white-space:nowrap}
.red i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde);margin-right:6px}
.red.mal i{background:var(--rojo)}
main{max-width:1360px;margin:0 auto;padding:20px 16px 90px}
h2.t{font-size:26px;margin:4px 0 4px}
.sub{color:var(--ink2);margin:0 0 18px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.esp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi small{display:block;color:var(--ink2);font-weight:600;font-size:14px}
.kpi b{display:block;font-size:30px;line-height:1.15;margin-top:4px}
.kpi span{font-size:13px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.vacio{color:var(--ink3);padding:14px 4px}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.item:first-of-type{border-top:0}
.item:hover{background:var(--grisf)}
.fecha{min-width:58px;text-align:center;border-radius:10px;background:var(--azulf);color:var(--azul);padding:5px 4px;font-weight:700;line-height:1.1}
.fecha small{display:block;font-size:11px;font-weight:600;text-transform:uppercase}
.fecha b{font-size:20px}
.fecha.venc{background:var(--rojof);color:var(--rojo)}
.fecha.hoy{background:var(--verdef);color:var(--verde)}
.it{flex:1;min-width:0}
.it b{display:block}
.it span{color:var(--ink2);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--grisf);color:var(--gris);white-space:nowrap}
.ch-Lead,.ch-Por-contactar{background:var(--grisf);color:var(--gris)}
.ch-Contactado,.ch-Conectado-en-LinkedIn{background:#E6F0FF;color:#1E5BC6}
.ch-Reunión,.ch-En-conversación{background:#DDEBFF;color:#1446A8}
.ch-Propuesta,.ch-Reunión-agendada{background:var(--amarf);color:#B45309}
.ch-Negociación{background:#FFE9D6;color:#C2410C}
.ch-Ganado,.ch-Aliado{background:var(--verdef);color:var(--verde)}
.ch-Perdido{background:var(--rojof);color:var(--rojo)}
.ch-Pausado{background:#EEF0F3;color:#6B7280}
.pr-Crítica{background:var(--rojof);color:var(--rojo)}
.pr-Alta{background:var(--amarf);color:#B45309}
.pr-Media{background:#E6F0FF;color:#1E5BC6}
.pr-Baja{background:var(--grisf);color:var(--gris)}
.ciclo{background:var(--moradof);color:var(--morado)}
.barras .b{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.barras .b div{height:12px;border-radius:6px;background:var(--grisf);overflow:hidden}
.barras .b div i{display:block;height:100%;border-radius:6px}
.critica{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.critica:hover{border-color:var(--azul)}
.critica .fila{gap:6px}
.critica p{margin:6px 0 0;color:var(--ink2);font-size:14px}
/* filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.pill{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink2)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill em{font-style:normal;opacity:.65;margin-left:4px}
.busca{min-width:220px;flex:1;max-width:360px}
select.in{padding:10px 12px;width:auto}
.vista{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.vista button{border:0;background:#fff;padding:9px 13px;font-weight:600;color:var(--ink2)}
.vista button.on{background:var(--azulf);color:var(--azul)}
/* tabla */
.tabla{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tabla th{text-align:left;font-size:13px;color:var(--ink2);background:#F8FAFC;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tabla td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.tabla tr:last-child td{border-bottom:0}
.tabla tbody tr{cursor:pointer}
.tabla tbody tr:hover td{background:#F8FAFC}
.tabla td.np{color:var(--ink2);font-size:14px;max-width:340px}
.tabla td b{font-weight:600}
.tabwrap{overflow-x:auto}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:#EDF0F5;border-radius:var(--r);padding:10px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.col.sobre{outline:2px dashed var(--azul);outline-offset:-4px}
.tar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tar b{display:block;font-size:15px}
.tar p{margin:5px 0 0;font-size:13.5px;color:var(--ink2)}
.tar .fila{gap:5px;margin-top:7px}
.tar.arr{opacity:.4}
/* drawer */
#velo{position:fixed;inset:0;background:rgba(23,32,51,.35);z-index:40}
#ficha{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
#ficha .cab{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#ficha .cab h3{margin:0;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#ficha .cuerpo{padding:16px 18px;overflow-y:auto;flex:1}
#ficha .pie{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.form .w{grid-column:1/-1}
.sec{margin:22px 0 8px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.linea{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.act{position:relative;padding:8px 0 12px}
.act:before{content:"";position:absolute;left:-23px;top:13px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--azul)}
.act.hecha:before{background:var(--verde);border-color:var(--verde)}
.act b{font-size:15px}
.act .m{font-size:13px;color:var(--ink3)}
.act p{margin:3px 0 0;font-size:14px;color:var(--ink2);white-space:pre-wrap}
.act .acc{display:flex;gap:6px;margin-top:6px}
.mini{font-size:13px;padding:4px 9px;border-radius:8px}
.nueva{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.nueva .form{grid-template-columns:1fr 1fr 1fr}
/* agenda */
.dia{margin-bottom:16px}
.dia h4{margin:0 0 6px;font-size:15px;color:var(--ink2);text-transform:capitalize}
.ag{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ag input[type=checkbox]{width:20px;height:20px;accent-color:var(--verde)}
.ag .h{font-weight:700;min-width:84px;color:var(--azul);white-space:nowrap;font-size:14px}
.ag .it{cursor:pointer}
.ag.hecha .it b{text-decoration:line-through;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:var(--sh)}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(37,99,235,.35)}
@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .tabla thead{display:none}
  .tabla,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
  .tabla tr{border-bottom:1px solid var(--line);padding:8px 0}
  .tabla td{border:0;padding:3px 14px}
  .tabla td[data-l]:before{content:attr(data-l) ": ";color:var(--ink3);font-size:13px}
  .form,.nueva .form{grid-template-columns:1fr}
  .red{display:none}
  .topin{flex-wrap:wrap;gap:8px}
  nav.tabs{order:3;flex-basis:100%}
  h2.t{font-size:22px}
}
</style>
</head>
<body>

<!-- ============ Acceso ============ -->
<section id="acceso">
  <form class="caja" id="fAcceso" autocomplete="off">
    <div class="marca"><div class="logo">A</div><b>CRM Achievers</b></div>
    <h1 id="aTit">Entrar</h1>
    <p id="aTxt">Escribe tu contraseña.</p>
    <div id="aCampos"></div>
    <label class="chk"><input type="checkbox" id="aRecordar" checked> Mantener la sesión en este dispositivo (30 días)</label>
    <button class="btn p full" id="aBtn" type="submit">Entrar</button>
    <div class="err" id="aErr" role="alert"></div>
  </form>
</section>

<!-- ============ App ============ -->
<div id="app" hidden>
  <header class="top"><div class="topin">
    <div class="marca"><div class="logo">A</div><b>CRM Achievers</b></div>
    <nav class="tabs" id="tabs">
      <button data-v="inicio" class="on">Inicio</button>
      <button data-v="empresas">Empresas</button>
      <button data-v="contactos">Contactos directos</button>
      <button data-v="agenda">Agenda</button>
      <button data-v="ajustes">Ajustes</button>
    </nav>
    <span class="red" id="red"><i></i>Conectado</span>
  </div></header>
  <main id="vista"></main>
  <button class="btn p fab" id="fab">+ Nuevo</button>
</div>

<div id="velo" hidden></div>
<aside id="ficha" hidden></aside>

<script>
(() => {
const API = 'https://uvodcmmehtghkbwadzlq.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_CLYuajCg_s7EcEQDBkKyNQ__j2Wg_t3';
const LS = 'crm-achievers-v2-sesion';

const ETAPAS = ['Lead','Contactado','Reunión','Propuesta','Negociación','Ganado','Perdido','Pausado'];
const ESTADOS_C = ['Por contactar','Conectado en LinkedIn','Contactado','En conversación','Reunión agendada','Aliado','Pausado'];
const PRIOR = ['Crítica','Alta','Media','Baja'];
const CICLOS = ['Ahora · nov–dic 2026','Recompra 2027-1','Reactivar 2027','Prospección 2027','Base fría','Cerrado'];
const TIPOS = ['Reunión','Llamada','WhatsApp','Correo','Tarea','Nota'];
const PRODUCTOS = ['JAM Lite','JAM Clásico','JAM Insider','Laboratorio Vivo','Fireside Chat','Invitado VIP','Bootcamp / evento','Proyecto a la medida'];
const COL_ETAPA = {Lead:'#94A3B8',Contactado:'#60A5FA',Reunión:'#3B82F6',Propuesta:'#F59E0B',Negociación:'#F97316',Ganado:'#16A34A',Perdido:'#DC2626',Pausado:'#9CA3AF'};

let token = null, regs = [], vistaAct = 'inicio', fichaId = null;
const est = { emp: { ciclo:'activas', q:'', prior:'', etapa:'', vista:'tabla', orden:'prior' }, con: { q:'', estado:'', prior:'', vista:'tabla' }, ag: { tipo:'' } };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls = s => String(s||'').replace(/\s+/g,'-');
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fDia = iso => { if(!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}); };
const fLarga = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}); };
const hora12 = h => { if(!h) return ''; const [H,M] = h.split(':').map(Number); return ((H%12)||12) + ':' + String(M).padStart(2,'0') + (H<12?' a. m.':' p. m.'); };
const nid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function toast(t){ const d = document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

async function rpc(f, body){
  const r = await fetch(API + f, { method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body||{}) });
  const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = t; }
  if(!r.ok){ const m = (j && j.message) || 'error'; const e = new Error(m); e.codigo = m; throw e; }
  return j;
}
function marcarRed(ok){ const r = $('#red'); r.classList.toggle('mal', !ok); r.lastChild.textContent = ok ? 'Conectado' : 'Sin conexión'; }

/* ================= Acceso ================= */
function guardarToken(t, recordar){
  token = t;
  try { (recordar ? localStorage : sessionStorage).setItem(LS, t); (recordar ? sessionStorage : localStorage).removeItem(LS); } catch {}
}
function leerToken(){ try { return localStorage.getItem(LS) || sessionStorage.getItem(LS); } catch { return null; } }
function borrarToken(){ token = null; try { localStorage.removeItem(LS); sessionStorage.removeItem(LS); } catch {} }

function codigoInicio(){
  const m = location.hash.match(/inicio=([a-f0-9]+)/i);
  if (m) { try { sessionStorage.setItem('crm-codigo', m[1]); } catch {} history.replaceState(null,'',location.pathname); return m[1]; }
  try { return sessionStorage.getItem('crm-codigo'); } catch { return null; }
}

async function iniciar(){
  const t = leerToken();
  if (t) { token = t; try { await cargar(); return entrarApp(); } catch(e){ borrarToken(); } }
  let configurada = true;
  try { configurada = (await rpc('acrm_estado')).configurada; } catch { $('#aErr').textContent = 'No hay conexión con la base. Intenta de nuevo.'; }
  const cod = codigoInicio();
  if (!configurada) {
    $('#aTit').textContent = 'Crea tu contraseña';
    if (!cod) { $('#aTxt').textContent = 'Este CRM todavía no tiene contraseña. Ábrelo desde el enlace que te llegó por WhatsApp para crearla.'; $('#aCampos').innerHTML=''; $('#aBtn').hidden = true; $('#aRecordar').parentElement.hidden = true; return; }
    $('#aTxt').textContent = 'Es la primera vez que entras. La contraseña que escribas queda guardada cifrada (nadie la puede leer, ni siquiera quien hizo el CRM). Después la puedes cambiar en Ajustes.';
    $('#aCampos').innerHTML = `<label class="l" for="c1">Contraseña nueva (mínimo 6 caracteres)</label><input class="in" id="c1" type="password" required minlength="6" autofocus>
      <label class="l" for="c2">Repítela</label><input class="in" id="c2" type="password" required minlength="6">`;
    $('#aBtn').textContent = 'Crear y entrar';
    $('#fAcceso').onsubmit = async ev => {
      ev.preventDefault(); const a = $('#c1').value, b = $('#c2').value;
      if (a !== b) return $('#aErr').textContent = 'Las dos contraseñas no son iguales.';
      $('#aBtn').disabled = true;
      try { guardarToken(await rpc('acrm_crear', { p_clave:a, p_codigo:cod }), $('#aRecordar').checked); try{sessionStorage.removeItem('crm-codigo');}catch{} await cargar(); entrarApp(); toast('Contraseña creada'); }
      catch(e){ $('#aErr').textContent = e.codigo === 'codigo_invalido' ? 'El enlace de inicio no es válido.' : e.codigo === 'ya_configurada' ? 'Ya había una contraseña. Recarga la página.' : 'No se pudo crear: ' + e.message; }
      $('#aBtn').disabled = false;
    };
  } else {
    $('#aCampos').innerHTML = `<label class="l" for="c1">Contraseña</label><input class="in" id="c1" type="password" required autofocus>`;
    $('#fAcceso').onsubmit = async ev => {
      ev.preventDefault(); $('#aBtn').disabled = true; $('#aErr').textContent = '';
      try { const t = await rpc('acrm_entrar', { p_clave: $('#c1').value });
        if (!t) $('#aErr').textContent = 'Contraseña incorrecta.';
        else { guardarToken(t, $('#aRecordar').checked); await cargar(); entrarApp(); } }
      catch(e){ $('#aErr').textContent = e.codigo === 'bloqueado' ? 'Demasiados intentos. Espera 15 minutos.' : 'No se pudo entrar: ' + e.message; }
      $('#aBtn').disabled = false;
    };
  }
}
function entrarApp(){ $('#acceso').hidden = true; $('#app').hidden = false; pintar(); }

async function cargar(){
  const d = await rpc('acrm_datos', { p_token: token });
  regs = d; marcarRed(true);
}
async function refrescar(){
  if (!token || document.hidden || !$('#ficha').hidden) return;
  try { await cargar(); pintar(); } catch(e){ if (e.codigo === 'sesion_invalida') salir(); else marcarRed(false); }
}
setInterval(refrescar, 60000);
document.addEventListener('visibilitychange', refrescar);

async function guardar(reg){
  try { const r = await rpc('acrm_guardar', { p_token: token, p_id: reg.id, p_tipo: reg.tipo, p_datos: reg.datos });
    const i = regs.findIndex(x => x.id === r.id); if (i >= 0) regs[i] = r; else regs.unshift(r); marcarRed(true); return r; }
  catch(e){ if (e.codigo === 'sesion_invalida') { salir(); throw e; } marcarRed(false); toast('No se pudo guardar'); throw e; }
}
async function borrar(id){
  await rpc('acrm_borrar', { p_token: token, p_id: id });
  regs = regs.filter(x => x.id !== id && !(x.tipo === 'actividad' && x.datos.ref === id));
}
async function salir(){ try { if (token) await rpc('acrm_salir', { p_token: token }); } catch {} borrarToken(); location.reload(); }

/* ================= Datos ================= */
const deTipo = t => regs.filter(r => r.tipo === t);
const porId = id => regs.find(r => r.id === id);
const actsDe = id => deTipo('actividad').filter(a => a.datos.ref === id).sort((a,b) => (b.datos.fecha||'').localeCompare(a.datos.fecha||'') || (b.datos.hora||'').localeCompare(a.datos.hora||''));
const nombreRef = id => { const r = porId(id); return r ? r.datos.nombre : ''; };
function proxAct(id){ const h = hoyISO(); return deTipo('actividad').filter(a => a.datos.ref === id && !a.datos.hecho && (a.datos.fecha||'') >= h).sort((a,b)=>(a.datos.fecha+a.datos.hora).localeCompare(b.datos.fecha+b.datos.hora))[0]; }
const ordPr = p => { const i = PRIOR.indexOf(p); return i < 0 ? 9 : i; };

/* ================= Pintar ================= */
function pintar(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === vistaAct));
  ({ inicio:vInicio, empresas:vEmpresas, contactos:vContactos, agenda:vAgenda, ajustes:vAjustes })[vistaAct]();
  $('#fab').hidden = vistaAct === 'ajustes';
}
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; vistaAct = b.dataset.v; pintar(); window.scrollTo(0,0); };

function chip(t, pre){ return t ? `<span class="chip ${pre||'ch'}-${cls(t)}">${esc(t)}</span>` : ''; }

function vInicio(){
  const emp = deTipo('empresa').map(r => r.datos), h = hoyISO();
  const activas = deTipo('empresa').filter(r => ['Ahora · nov–dic 2026','Recompra 2027-1'].includes(r.datos.ciclo) && !['Perdido','Pausado'].includes(r.datos.etapa));
  const acts = deTipo('actividad').filter(a => !a.datos.hecho);
  const en7 = new Date(); en7.setDate(en7.getDate() + 7); const h7 = en7.toISOString().slice(0,10);
  const semana = acts.filter(a => a.datos.fecha >= h && a.datos.fecha <= h7).sort((a,b)=>(a.datos.fecha+(a.datos.hora||'')).localeCompare(b.datos.fecha+(b.datos.hora||'')));
  const vencidas = acts.filter(a => a.datos.fecha && a.datos.fecha < h);
  const conv = deTipo('contacto').filter(r => ['En conversación','Reunión agendada'].includes(r.datos.estado)).length;
  const criticas = deTipo('empresa').filter(r => r.datos.prioridad === 'Crítica').sort((a,b)=>(a.datos.proxima_fecha||'9').localeCompare(b.datos.proxima_fecha||'9'));
  const cuenta = {}; deTipo('empresa').filter(r => r.datos.ciclo !== 'Base fría').forEach(r => cuenta[r.datos.etapa] = (cuenta[r.datos.etapa]||0) + 1);
  const max = Math.max(1, ...Object.values(cuenta));
  $('#vista').innerHTML = `
    <h2 class="t">Inicio</h2><p class="sub">${fLarga(h)}</p>
    <div class="kpis">
      <div class="kpi"><small>Cuentas activas</small><b>${activas.length}</b><span>Ahora y recompra 2027-1</span></div>
      <div class="kpi"><small>Próximos 7 días</small><b>${semana.length}</b><span>reuniones y tareas</span></div>
      <div class="kpi"><small>Vencidas sin marcar</small><b style="color:${vencidas.length?'var(--rojo)':'inherit'}">${vencidas.length}</b><span>revísalas en Agenda</span></div>
      <div class="kpi"><small>Contactos en conversación</small><b>${conv}</b><span>amigos de Luis</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>📅 Esta semana</h3>${semana.length ? semana.map(itemAct).join('') : '<div class="vacio">Nada agendado en los próximos 7 días.</div>'}
        ${vencidas.length ? `<h3 style="margin-top:18px">⚠️ Vencidas</h3>${vencidas.slice(0,6).map(itemAct).join('')}` : ''}</div>
      <div>
        <div class="panel" style="margin-bottom:16px"><h3>🔥 Cuentas críticas</h3>${criticas.map(r => `
          <div class="critica" data-id="${r.id}"><div class="fila"><b style="flex:1">${esc(r.datos.nombre)}</b>${chip(r.datos.etapa)}</div>
          <p>${r.datos.proxima_fecha ? `<b>${fDia(r.datos.proxima_fecha)}:</b> ` : ''}${esc(r.datos.proximo_paso||'')}</p></div>`).join('') || '<div class="vacio">Sin cuentas críticas.</div>'}</div>
        <div class="panel"><h3>📊 Embudo (sin base fría)</h3><div class="barras">${ETAPAS.map(e => `
          <div class="b"><span>${e}</span><div><i style="width:${(cuenta[e]||0)/max*100}%;background:${COL_ETAPA[e]}"></i></div><b>${cuenta[e]||0}</b></div>`).join('')}</div></div>
      </div>
    </div>`;
  $('#vista').querySelectorAll('[data-id]').forEach(el => el.onclick = () => abrir(el.dataset.id));
  $('#vista').querySelectorAll('[data-act]').forEach(el => el.onclick = () => abrirAct(el.dataset.act));
}
function itemAct(a){
  const d = a.datos, h = hoyISO(), dt = new Date(d.fecha + 'T12:00:00');
  const c = d.fecha < h ? 'venc' : d.fecha === h ? 'hoy' : '';
  const ref = d.ref ? nombreRef(d.ref) : 'Equipo Achievers';
  return `<div class="item" data-act="${a.id}"><div class="fecha ${c}"><small>${dt.toLocaleDateString('es-CO',{month:'short'})}</small><b>${dt.getDate()}</b></div>
    <div class="it"><b>${esc(d.titulo)}</b><span>${esc(d.tipo)}${d.hora ? ' · ' + hora12(d.hora) : ''} · ${esc(ref)}${d.lugar ? ' · ' + esc(d.lugar) : ''}</span></div></div>`;
}

/* ----- Empresas ----- */
function filtrarEmp(){
  const f = est.emp, q = f.q.toLowerCase().trim();
  return deTipo('empresa').filter(r => {
    const d = r.datos;
    if (f.ciclo === 'activas' ? d.ciclo === 'Base fría' : f.ciclo && f.ciclo !== 'todas' && d.ciclo !== f.ciclo) return false;
    if (f.prior && d.prioridad !== f.prior) return false;
    if (f.etapa && d.etapa !== f.etapa) return false;
    if (q && !JSON.stringify(d).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => f.orden === 'nombre' ? a.datos.nombre.localeCompare(b.datos.nombre) :
     f.orden === 'fecha' ? (a.datos.proxima_fecha||'9').localeCompare(b.datos.proxima_fecha||'9') :
     ordPr(a.datos.prioridad) - ordPr(b.datos.prioridad) || (a.datos.proxima_fecha||'9').localeCompare(b.datos.proxima_fecha||'9') || a.datos.nombre.localeCompare(b.datos.nombre));
}
function vEmpresas(){
  const f = est.emp, todas = deTipo('empresa');
  const n = c => c === 'activas' ? todas.filter(r => r.datos.ciclo !== 'Base fría').length : c === 'todas' ? todas.length : todas.filter(r => r.datos.ciclo === c).length;
  const lista = filtrarEmp();
  $('#vista').innerHTML = `
    <div class="fila"><h2 class="t esp">Empresas</h2>
      <div class="vista"><button data-vv="tabla" class="${f.vista==='tabla'?'on':''}">Tabla</button><button data-vv="embudo" class="${f.vista==='embudo'?'on':''}">Embudo</button></div></div>
    <p class="sub">Separadas por tiempos: lo de ahora, la recompra de 2027-1 y lo que se prospecta después.</p>
    <div class="filtros" id="fc">${[['activas','Todas sin base fría'],...CICLOS.map(c=>[c,c]),['todas','Todo']].map(([v,t]) => `<button class="pill ${f.ciclo===v?'on':''}" data-c="${esc(v)}">${esc(t)}<em>${n(v)}</em></button>`).join('')}</div>
    <div class="fila" style="margin-bottom:14px">
      <input class="in busca" id="q" placeholder="Buscar empresa, contacto, nota…" value="${esc(f.q)}">
      <select class="in" id="fp"><option value="">Toda prioridad</option>${PRIOR.map(p=>`<option ${f.prior===p?'selected':''}>${p}</option>`).join('')}</select>
      <select class="in" id="fe"><option value="">Toda etapa</option>${ETAPAS.map(p=>`<option ${f.etapa===p?'selected':''}>${p}</option>`).join('')}</select>
      <select class="in" id="fo"><option value="prior" ${f.orden==='prior'?'selected':''}>Ordenar: prioridad</option><option value="fecha" ${f.orden==='fecha'?'selected':''}>Ordenar: próxima fecha</option><option value="nombre" ${f.orden==='nombre'?'selected':''}>Ordenar: nombre</option></select>
      <span class="esp"></span><b>${lista.length}</b>&nbsp;empresas</div>
    <div id="cuerpo"></div>`;
  $('#cuerpo').innerHTML = f.vista === 'tabla' ? tablaEmp(lista) : kanban(lista, ETAPAS, 'etapa', d => `<b>${esc(d.nombre)}</b><div class="fila">${chip(d.prioridad,'pr')}</div>${d.proximo_paso?`<p>${d.proxima_fecha?`<b>${fDia(d.proxima_fecha)}:</b> `:''}${esc(d.proximo_paso.slice(0,110))}</p>`:''}`);
  enlazarLista('emp');
}
function tablaEmp(l){
  if (!l.length) return '<div class="panel vacio">No hay empresas con esos filtros.</div>';
  return `<div class="tabwrap"><table class="tabla"><thead><tr><th>Empresa</th><th>Etapa</th><th>Prioridad</th><th>Tiempo</th><th>Próximo paso</th><th>Fecha</th></tr></thead><tbody>${l.slice(0,400).map(r => { const d = r.datos; return `
    <tr data-id="${r.id}"><td><b>${esc(d.nombre)}</b><br><span style="color:var(--ink3);font-size:13px">${esc(d.contactos||d.industria||'')}</span></td>
    <td data-l="Etapa">${chip(d.etapa)}</td><td data-l="Prioridad">${chip(d.prioridad,'pr')}</td><td data-l="Tiempo"><span class="chip ciclo">${esc(d.ciclo||'')}</span></td>
    <td class="np" data-l="Próximo paso">${esc(d.proximo_paso||'')}</td><td data-l="Fecha">${d.proxima_fecha?fDia(d.proxima_fecha):''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function kanban(l, columnas, campo, tarjeta){
  return `<div class="kan">${columnas.map(c => { const cs = l.filter(r => (r.datos[campo]||columnas[0]) === c); return `
    <div class="col" data-col="${esc(c)}"><h4><span>${esc(c)}</span><span class="chip">${cs.length}</span></h4>
    ${cs.slice(0,150).map(r => `<div class="tar" draggable="true" data-id="${r.id}">${tarjeta(r.datos)}</div>`).join('')}${cs.length>150?`<div class="vacio">+${cs.length-150} más (usa filtros)</div>`:''}</div>`; }).join('')}</div>`;
}
function enlazarLista(cual){
  const f = cual === 'emp' ? est.emp : est.con, re = cual === 'emp' ? vEmpresas : vContactos;
  $('#vista').querySelectorAll('[data-vv]').forEach(b => b.onclick = () => { f.vista = b.dataset.vv; re(); });
  $('#vista').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { f.ciclo = b.dataset.c; re(); });
  const q = $('#q'); q.oninput = () => { f.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { re(); const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  if ($('#fp')) $('#fp').onchange = e => { f.prior = e.target.value; re(); };
  if ($('#fe')) $('#fe').onchange = e => { f[cual==='emp'?'etapa':'estado'] = e.target.value; re(); };
  if ($('#fo')) $('#fo').onchange = e => { f.orden = e.target.value; re(); };
  $('#vista').querySelectorAll('tr[data-id],.tar').forEach(el => el.onclick = () => abrir(el.dataset.id));
  // arrastrar en el embudo
  let arr = null;
  $('#vista').querySelectorAll('.tar').forEach(t => { t.ondragstart = () => { arr = t.dataset.id; t.classList.add('arr'); }; t.ondragend = () => t.classList.remove('arr'); });
  $('#vista').querySelectorAll('.col').forEach(c => {
    c.ondragover = e => { e.preventDefault(); c.classList.add('sobre'); };
    c.ondragleave = () => c.classList.remove('sobre');
    c.ondrop = async e => { e.preventDefault(); c.classList.remove('sobre'); const r = porId(arr); if (!r) return;
      const campo = r.tipo === 'empresa' ? 'etapa' : 'estado'; if (r.datos[campo] === c.dataset.col) return;
      const antes = r.datos[campo]; r.datos[campo] = c.dataset.col;
      try { await guardar({ ...r, datos: r.datos }); await guardar({ id: nid('a'), tipo:'actividad', datos:{ ref:r.id, tipo:'Nota', titulo:`Cambió de «${antes}» a «${c.dataset.col}»`, fecha:hoyISO(), hecho:true } }); toast('Movida a ' + c.dataset.col); } catch {}
      re(); };
  });
}

/* ----- Contactos ----- */

  const f = est.con, q = f.q.toLowerCase().trim();
  const l = deTipo('contacto').filter(r => (!f.estado || r.datos.estado === f.estado) && (!f.prior || r.datos.prioridad === f.prior) && (!q || JSON.stringify(r.datos).toLowerCase().includes(q)))
    .sort((a,b) => ESTADOS_C.indexOf(b.datos.estado) - ESTADOS_C.indexOf(a.datos.estado) || ordPr(a.datos.prioridad) - ordPr(b.datos.prioridad) || a.datos.nombre.localeCompare(b.datos.nombre));
  $('#vista').innerHTML = `
    <div class="fila"><h2 class="t esp">Contactos directos</h2>

    <p class="sub">Amigos y red de Luis Carlos: a quién ya contactamos, con quién hay conversación y la siguiente reunión.</p>
    <div class="filtros">${['',...ESTADOS_C].map(s => `<button class="pill ${f.estado===s?'on':''}" data-es="${esc(s)}">${s||'Todos'}<em>${s?deTipo('contacto').filter(r=>r.datos.estado===s).length:deTipo('contacto').length}</em></button>`).join('')}</div>
    <div class="fila" style="margin-bottom:14px"><input class="in busca" id="q" placeholder="Buscar nombre, empresa, referente…" value="${esc(f.q)}">
      <select class="in" id="fp"><option value="">Toda prioridad</option>${PRIOR.map(p=>`<option ${f.prior===p?'selected':''}>${p}</option>`).join('')}</select><span class="esp"></span><b>${l.length}</b>&nbsp;contactos</div>
    <div id="cuerpo"></div>`;
  $('#cuerpo').innerHTML = f.vista === 'embudo' ? kanban(l, ESTADOS_C, 'estado', d => `<b>${esc(d.nombre)}</b><div class="fila">${chip(d.prioridad,'pr')}</div><p>${esc(d.perfil||d.enfoque||'')}</p>`) :
    (!l.length ? '<div class="panel vacio">No hay contactos con esos filtros.</div>' : `<div class="tabwrap"><table class="tabla"><thead><tr><th>Nombre</th><th>Estado</th><th>Prioridad</th><th>Referente</th><th>Canal</th><th>Próximo paso</th><th>Fecha</th></tr></thead><tbody>${l.map(r => { const d = r.datos; const p = proxAct(r.id); return `
      <tr data-id="${r.id}"><td><b>${esc(d.nombre)}</b><br><span style="color:var(--ink3);font-size:13px">${esc(d.perfil||'')}</span></td><td data-l="Estado">${chip(d.estado)}</td><td data-l="Prioridad">${chip(d.prioridad,'pr')}</td>
      <td data-l="Referente">${esc(d.referente||'')}</td><td data-l="Canal">${esc(d.canal||'')}</td><td class="np" data-l="Próximo paso">${esc(d.proximo_paso||'')}</td><td data-l="Fecha">${p?fDia(p.datos.fecha):d.proxima_fecha?fDia(d.proxima_fecha):''}</td></tr>`; }).join('')}</tbody></table></div>`);
  $('#vista').querySelectorAll('[data-es]').forEach(b => b.onclick = () => { f.estado = b.dataset.es; vContactos(); });
  enlazarLista('con');
}

/* ----- Agenda ----- */
function vAgenda(){
  const h = hoyISO(), f = est.ag;
  const todas = deTipo('actividad').filter(a => a.datos.fecha && (!f.tipo || a.datos.tipo === f.tipo));
  const prox = todas.filter(a => !a.datos.hecho && a.datos.fecha >= h).sort((a,b)=>(a.datos.fecha+(a.datos.hora||'')).localeCompare(b.datos.fecha+(b.datos.hora||'')));
  const venc = todas.filter(a => !a.datos.hecho && a.datos.fecha < h).sort((a,b)=>b.datos.fecha.localeCompare(a.datos.fecha));
  const hechas = todas.filter(a => a.datos.hecho).sort((a,b)=>b.datos.fecha.localeCompare(a.datos.fecha)).slice(0,25);
  const dias = {}; prox.forEach(a => (dias[a.datos.fecha] = dias[a.datos.fecha] || []).push(a));
  const fila = a => { const d = a.datos; return `<div class="ag ${d.hecho?'hecha':''}"><input type="checkbox" data-ok="${a.id}" ${d.hecho?'checked':''} title="Marcar como hecha">
     <span class="h">${d.hora?hora12(d.hora):'—'}</span><div class="it" data-act="${a.id}"><b>${esc(d.titulo)}</b><span>${esc(d.tipo)} · ${esc(d.ref?nombreRef(d.ref):'Equipo Achievers')}${d.lugar?' · '+esc(d.lugar):''}${d.hecho?' · '+fDia(d.fecha):''}</span></div></div>`; };
  $('#vista').innerHTML = `<div class="fila"><h2 class="t esp">Agenda</h2><select class="in" id="ft"><option value="">Todo tipo</option>${TIPOS.map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <p class="sub">Siguientes reuniones y tareas. Marca la casilla cuando ya pasó.</p>
    ${venc.length?`<div class="panel" style="margin-bottom:16px;border-color:#F3C4C4"><h3>⚠️ Vencidas sin marcar (${venc.length})</h3>${venc.map(fila).join('')}</div>`:''}
    <div class="panel" style="margin-bottom:16px"><h3>📅 Próximas</h3>${Object.keys(dias).map(k => `<div class="dia"><h4>${k===h?'Hoy · ':''}${fLarga(k)}</h4>${dias[k].map(fila).join('')}</div>`).join('') || '<div class="vacio">No hay nada agendado.</div>'}</div>
    <div class="panel"><h3>✅ Hechas recientes</h3>${hechas.map(fila).join('') || '<div class="vacio">Aún nada.</div>'}</div>`;
  $('#ft').onchange = e => { f.tipo = e.target.value; vAgenda(); };
  $('#vista').querySelectorAll('[data-act]').forEach(el => el.onclick = () => abrirAct(el.dataset.act));
  $('#vista').querySelectorAll('[data-ok]').forEach(el => el.onchange = async () => { const a = porId(el.dataset.ok); a.datos.hecho = el.checked; try { await guardar(a); } catch {} vAgenda(); });
}

  $('#xC').onclick = () => csv('contactos', deTipo('contacto'), ['nombre','estado','prioridad','perfil','referente','canal','telefono','correo','enfoque','proximo_paso','proxima_fecha','notas']);
  $('#xA').onclick = () => csv('agenda', deTipo('actividad').map(a => ({...a, datos:{...a.datos, relacionado: a.datos.ref?nombreRef(a.datos.ref):''}})), ['fecha','hora','tipo','titulo','relacionado','lugar','hecho','notas']);
}
function csv(n, l, cols){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const t = '﻿' + cols.join(';') + '\n' + l.map(r => cols.map(c => q(r.datos[c])).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type:'text/csv'})); a.download = `crm_achievers_${n}_${hoyISO()}.csv`; a.click();
}

/* ================= Ficha ================= */
function campo(k, t, v, tipo, ops, w){
  const id = 'f_' + k;
  if (tipo === 'sel') return `<div class="${w||''}"><label class="l" for="${id}">${t}</label><select class="in" id="${id}" data-k="${k}" style="width:100%"><option value=""></option>${ops.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if (tipo === 'area') return `<div class="w"><label class="l" for="${id}">${t}</label><textarea class="in" id="${id}" data-k="${k}">${esc(v)}</textarea></div>`;
  return `<div class="${w||''}"><label class="l" for="${id}">${t}</label><input class="in" id="${id}" data-k="${k}" type="${tipo||'text'}" value="${esc(v)}"${tipo==='number'?' inputmode="numeric" step="1000000"':''}></div>`;
}
function abrir(id, nuevoTipo){
  let r = id ? porId(id) : null;
  if (!r) r = { id: nid(nuevoTipo === 'contacto' ? 'c' : 'e'), tipo: nuevoTipo, datos: nuevoTipo === 'contacto' ? { estado:'Por contactar', prioridad:'Media', responsable:'' } : { etapa:'Lead', prioridad:'Media', ciclo:'Ahora · nov–dic 2026', responsable:'' }, nuevo:true };
  fichaId = r.id; const d = r.datos, emp = r.tipo === 'empresa';
  const campos = emp ? [
    campo('nombre','Nombre de la empresa',d.nombre,'text',null,'w'),
    campo('etapa','Etapa',d.etapa,'sel',ETAPAS), campo('prioridad','Prioridad',d.prioridad,'sel',PRIOR),
    campo('ciclo','Tiempo',d.ciclo,'sel',CICLOS), campo('responsable','Responsable',d.responsable),
    campo('industria','Industria',d.industria), campo('producto','Producto / formato',d.producto,'text'),
    campo('proxima_fecha','Fecha del próximo paso',d.proxima_fecha,'date'),
    campo('contactos','Contactos clave',d.contactos,'text',null,'w'),
    campo('proximo_paso','Próximo paso',d.proximo_paso,'area'),
    campo('descripcion','Qué es / qué se ofrece',d.descripcion,'area'), campo('historial','Historial',d.historial,'area'), campo('notas','Notas',d.notas,'area')
  ] : [
    campo('nombre','Nombre',d.nombre,'text',null,'w'),
    campo('estado','Estado',d.estado,'sel',ESTADOS_C), campo('prioridad','Prioridad',d.prioridad,'sel',PRIOR),
    campo('perfil','Cargo / empresa',d.perfil,'text',null,'w'), campo('referente','Referente',d.referente), campo('canal','Canal',d.canal),
    campo('telefono','Teléfono',d.telefono,'tel'), campo('correo','Correo',d.correo,'email'),
    campo('responsable','Responsable',d.responsable), campo('proxima_fecha','Fecha del próximo paso',d.proxima_fecha,'date'),
    campo('enfoque','Para qué / ángulo',d.enfoque,'area'), campo('proximo_paso','Próximo paso',d.proximo_paso,'area'), campo('notas','Notas',d.notas,'area')
  ];
  const acts = r.nuevo ? [] : actsDe(r.id);
  const f = $('#ficha');
  f.innerHTML = `<div class="cab"><h3>${esc(d.nombre || (emp ? 'Nueva empresa' : 'Nuevo contacto'))}</h3>${emp?chip(d.etapa):chip(d.estado)}<button class="btn" id="cerrar" aria-label="Cerrar">✕</button></div>
   <div class="cuerpo"><div class="form">${campos.join('')}</div>
   ${r.nuevo ? '' : `<div class="sec">🗓️ Reuniones, tareas y notas</div>
   <div class="nueva"><div class="form">${campo('n_tipo','Tipo','Reunión','sel',TIPOS)}${campo('n_fecha','Fecha',hoyISO(),'date')}${campo('n_hora','Hora','', 'time')}
     ${campo('n_titulo','Qué','', 'text',null,'w')}${campo('n_notas','Detalle (opcional)','','area')}</div>
     <div class="fila" style="margin-top:8px"><label class="chk" style="margin:0"><input type="checkbox" id="n_hecho"> Ya pasó</label><span class="esp"></span><button class="btn p" id="addAct">Agregar</button></div></div>
   <div class="linea" style="margin-top:14px">${acts.map(a => `<div class="act ${a.datos.hecho?'hecha':''}"><b>${esc(a.datos.titulo)}</b>
      <div class="m">${esc(a.datos.tipo)} · ${fDia(a.datos.fecha)}${a.datos.hora?' · '+hora12(a.datos.hora):''}${a.datos.lugar?' · '+esc(a.datos.lugar):''}${a.datos.hecho?' · hecha':''}</div>
      ${a.datos.notas?`<p>${esc(a.datos.notas)}</p>`:''}<div class="acc">${a.datos.hecho?'':`<button class="btn mini" data-hecha="${a.id}">Marcar hecha</button>`}<button class="btn mini" data-edit="${a.id}">Editar</button></div></div>`).join('') || '<div class="vacio">Sin actividad registrada.</div>'}</div>`}
   </div>
   <div class="pie">${r.nuevo?'':'<button class="btn r" id="borrar">Borrar</button>'}<span class="esp"></span><button class="btn" id="cancelar">Cancelar</button><button class="btn p" id="guardarF">Guardar</button></div>`;
  f.hidden = false; $('#velo').hidden = false; document.body.style.overflow = 'hidden';
  const cerrar = () => { f.hidden = true; $('#velo').hidden = true; document.body.style.overflow = ''; fichaId = null; pintar(); };
  $('#cerrar').onclick = $('#cancelar').onclick = $('#velo').onclick = cerrar;
  $('#guardarF').onclick = async () => {
    const nd = { ...d }; f.querySelectorAll('.form [data-k]').forEach(el => { if (el.dataset.k.startsWith('n_')) return; nd[el.dataset.k] = el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim(); }); delete nd.valor; delete nd.valor_nota;
    if (!nd.nombre) return toast('Escribe el nombre');
    const antes = emp ? d.etapa : d.estado, despues = emp ? nd.etapa : nd.estado;
    try { await guardar({ id: r.id, tipo: r.tipo, datos: nd });
      if (!r.nuevo && antes !== despues) await guardar({ id: nid('a'), tipo:'actividad', datos:{ ref:r.id, tipo:'Nota', titulo:`Cambió de «${antes}» a «${despues}»`, fecha:hoyISO(), hecho:true } });
      toast('Guardado'); cerrar(); } catch {}
  };
  if (!r.nuevo) {
    $('#borrar').onclick = async () => { if (!confirm(`¿Borrar «${d.nombre}» y su historial? No se puede deshacer.`)) return; try { await borrar(r.id); toast('Borrado'); cerrar(); } catch { toast('No se pudo borrar'); } };
    $('#addAct').onclick = async () => {
      const t = $('#f_n_titulo').value.trim(); if (!t) return toast('Escribe qué es');
      try { await guardar({ id: nid('a'), tipo:'actividad', datos:{ ref:r.id, tipo:$('#f_n_tipo').value||'Nota', fecha:$('#f_n_fecha').value, hora:$('#f_n_hora').value, titulo:t, notas:$('#f_n_notas').value.trim(), hecho:$('#n_hecho').checked } }); toast('Agregado'); abrir(r.id); } catch {}
    };
    f.querySelectorAll('[data-hecha]').forEach(b => b.onclick = async () => { const a = porId(b.dataset.hecha); a.datos.hecho = true; try { await guardar(a); abrir(r.id); } catch {} });
    f.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => abrirAct(b.dataset.edit));
  }
}
function abrirAct(id, nueva){
  const a = id ? porId(id) : { id: nid('a'), tipo:'actividad', datos:{ tipo:'Reunión', fecha:hoyISO(), hecho:false, ref:'' }, nuevo:true };
  if (!a) return; const d = a.datos;
  const refs = [...deTipo('empresa').filter(r=>r.datos.ciclo!=='Base fría'), ...deTipo('contacto')].sort((x,y)=>x.datos.nombre.localeCompare(y.datos.nombre));
  const f = $('#ficha');
  f.innerHTML = `<div class="cab"><h3>${a.nuevo?'Nueva reunión o tarea':esc(d.titulo)}</h3><button class="btn" id="cerrar">✕</button></div>
   <div class="cuerpo"><div class="form">
     ${campo('titulo','Qué',d.titulo,'text',null,'w')}${campo('tipo','Tipo',d.tipo,'sel',TIPOS)}
     <div><label class="l" for="f_ref">Empresa o contacto</label><select class="in" id="f_ref" data-k="ref" style="width:100%"><option value="">Equipo Achievers (general)</option>${refs.map(r=>`<option value="${r.id}" ${r.id===d.ref?'selected':''}>${esc(r.datos.nombre)}${r.tipo==='contacto'?' (contacto)':''}</option>`).join('')}</select></div>
     ${campo('fecha','Fecha',d.fecha,'date')}${campo('hora','Hora',d.hora,'time')}${campo('lugar','Lugar o enlace',d.lugar,'text',null,'w')}${campo('notas','Detalle',d.notas,'area')}
   </div><label class="chk"><input type="checkbox" id="f_hecho" ${d.hecho?'checked':''}> Ya pasó / hecha</label>
   ${d.ref && !a.nuevo ? `<p style="margin-top:16px"><button class="btn" id="irRef">Abrir ${esc(nombreRef(d.ref))}</button></p>`:''}</div>
   <div class="pie">${a.nuevo?'':'<button class="btn r" id="borrar">Borrar</button>'}<span class="esp"></span><button class="btn" id="cancelar">Cancelar</button><button class="btn p" id="guardarF">Guardar</button></div>`;
  f.hidden = false; $('#velo').hidden = false; document.body.style.overflow = 'hidden';
  const cerrar = () => { f.hidden = true; $('#velo').hidden = true; document.body.style.overflow = ''; pintar(); };
  $('#cerrar').onclick = $('#cancelar').onclick = $('#velo').onclick = cerrar;
  if ($('#irRef')) $('#irRef').onclick = () => abrir(d.ref);
  $('#guardarF').onclick = async () => { const nd = { ...d }; f.querySelectorAll('[data-k]').forEach(el => nd[el.dataset.k] = el.value.trim()); nd.hecho = $('#f_hecho').checked;
    if (!nd.titulo) return toast('Escribe qué es'); try { await guardar({ id:a.id, tipo:'actividad', datos:nd }); toast('Guardado'); cerrar(); } catch {} };
  if (!a.nuevo) $('#borrar').onclick = async () => { if (!confirm('¿Borrar esta actividad?')) return; try { await borrar(a.id); cerrar(); } catch {} };
}
$('#fab').onclick = () => {
  if (vistaAct === 'contactos') abrir(null, 'contacto');
  else if (vistaAct === 'agenda' || vistaAct === 'inicio') abrirAct(null, true);
  else abrir(null, 'empresa');
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ficha').hidden) $('#cancelar')?.click(); });

iniciar();
})();
</script>
